# @package _global_

use_wandb: True

wandb:
  wandb_project: null
  wandb_tags: 'online' # Legacy field; does not select the SDK logging mode.
  wandb_mode: null # online, offline, disabled; null uses the SDK default.
  wandb_group: null
  wandb_id: null
  wandb_entity: null
  wandb_dir: '/tmp' # use /tmp so that it will automatically be cleaned up
  # wandb_dir: ${experiment_dir}/.wandb
